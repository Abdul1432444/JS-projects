<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mobile Clone</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <div class="phone">
      <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋</span>
      </div>

      <div class="screen">
        <div class="app-grid">
          <div class="app">
            <img src="https://img.icons8.com/color/96/phone.png" />
            <p>Phone</p>
          </div>

          <div class="app">
            <img src="https://img.icons8.com/color/96/whatsapp.png" />
            <p>WhatsApp</p>
          </div>

          <div class="app">
            <img src="https://img.icons8.com/color/96/youtube-play.png" />
            <p>YouTube</p>
          </div>

          <div class="app">
            <img src="https://img.icons8.com/color/96/camera.png" />
            <p>Camera</p>
          </div>

          <div class="app">
            <img src="https://img.icons8.com/color/96/google.png" />
            <p>Google</p>
          </div>

          <div class="app">
            <img src="https://img.icons8.com/color/96/facebook.png" />
            <p>Facebook</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
